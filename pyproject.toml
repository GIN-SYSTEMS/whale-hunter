[tool.setuptools.package-dir]
"" = "."

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "whale-hunter"
version         = "11.0.0"
description     = "Sovereign-grade targeted wallet monitoring for Ethereum and EVM chains"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }
authors         = [{ name = "Whale Hunter Contributors" }]
keywords        = [
    "ethereum",
    "mempool",
    "blockchain",
    "monitoring",
    "tui",
    "intelligence",
    "on-chain",
    "watchlist",
    "sentinel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "textual>=0.80",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
fast       = ["orjson>=3.10", "uvloop>=0.19; sys_platform != 'win32'"]
priority   = ["psutil>=5.9"]
clickhouse = ["clickhouse-connect>=0.7"]
all        = ["whale-hunter[fast,priority,clickhouse]"]

[project.scripts]
whale-hunter = "main:main"

[project.urls]
Homepage = "https://github.com/GIN-SYSTEMS/whale-hunter"
Issues   = "https://github.com/GIN-SYSTEMS/whale-hunter/issues"
Source   = "https://github.com/GIN-SYSTEMS/whale-hunter"

[tool.setuptools]
py-modules           = ["main"]
packages             = [
    "alerts",
    "core",
    "hunters",
    "ingestion",
    "simulator",
    "ui",
    "utils",
]
include-package-data = true
